display_information:
  name: Ryanair News Agent
  description: Monitors Ryanair and competitor news and drafts PR responses
  background_color: "#073590"
features:
  bot_user:
    display_name: Ryanair News Agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.public
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
